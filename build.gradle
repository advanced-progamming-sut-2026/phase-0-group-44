plugins {
    id 'java'
    id 'application'
    id 'checkstyle'
    id 'pmd'
}

repositories {
    mavenCentral()
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
        resources {
            srcDirs = ['pvz-assets']   // or wherever the folder lives, e.g. 'assets'
        }
    }
    test {
        java {
            srcDirs = ['test']
        }
    }
}

ext {
    gdxVersion = '1.14.2'
}

dependencies {
    implementation 'com.google.code.gson:gson:2.13.1'

    // LibGDX core API (رندر، input، math، Scene2D و...)
    implementation "com.badlogicgames.gdx:gdx:$gdxVersion"

    // بک‌اند دسکتاپ (LWJGL3) — پنجره، OpenGL context، صدا
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"

    // native library های پلتفرم دسکتاپ (لازم برای اجرا، نه فقط کامپایل)
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'Main'
}
tasks.named('run') {
    standardInput = System.in
    jvmArgs += ['-XstartOnFirstThread']
}
jar {
    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }
    // چون از native libraries استفاده می‌کنیم، jar باید fat/uber jar باشه یا از shadow plugin استفاده کنید
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}

checkstyle {
    toolVersion = '10.17.0'
    configFile = file('config/checkstyle/checkstyle.xml')
    showViolations = true
}

pmd {
    toolVersion = '7.3.0'
    ruleSets = []
    ruleSetFiles = files('config/pmd/pmd-ruleset.xml')
    consoleOutput = true
}

tasks.withType(Checkstyle).configureEach {
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.withType(Pmd).configureEach {
    reports {
        xml.required = true
        html.required = true
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
    }
}